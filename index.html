<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daylon Rock | Professional Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-3xl mx-auto px-6 py-12 w-full">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400 mb-2">Daylon Rock</h1>
            <p class="text-slate-400 text-lg">IT Infrastructure & Cloud Enthusiast</p>
        </header>

        <main class="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-slate-100">Leave a Message</h2>
            
            <!-- Success/Error Notification Banner -->
            <div id="form-status" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

            <!-- Form without action/method attributes to allow async JS handling -->
            <form id="contactForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
                    <input type="text" id="sender_name" name="sender_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Message</label>
                    <textarea id="content" name="content" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-colors duration-200">
                    Send Message
                </button>
            </form>
        </main>
    </div>

    <footer class="text-center py-6 text-slate-500 text-sm">
        &copy; 2026 Daylon Rock. All rights reserved.
    </footer>

    <!-- JavaScript placed properly inside the body so it runs -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const statusDiv = document.getElementById('form-status');
            
            btn.disabled = true;
            btn.textContent = 'Sending...';
            statusDiv.classList.add('hidden');

            const formData = {
                sender_name: document.getElementById('sender_name').value,
                email: document.getElementById('email').value,
                content: document.getElementById('content').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                statusDiv.classList.remove('hidden');
                if (response.ok && result.success) {
                    statusDiv.className = "mb-6 p-4 rounded-lg text-sm bg-emerald-900/50 border border-emerald-500 text-emerald-200";
                    statusDiv.textContent = "Thank you! Your message has been sent successfully.";
                    document.getElementById('contactForm').reset();
                } else {
                    throw new Error(result.error || 'Something went wrong.');
                }
            } catch (error) {
                statusDiv.className = "mb-6 p-4 rounded-lg text-sm bg-rose-900/50 border border-rose-500 text-rose-200";
                statusDiv.textContent = "Failed to send message. Please try again later.";
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
